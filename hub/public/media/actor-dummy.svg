<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 128" width="240" height="320">
  <!-- lenhon.dev inspector Actor Dummy: clay/AO silhouette, hero in a combat stance facing +x.
       feet_ground (0, 0) is at (48, 122) in this box. -->
  <defs>
    <radialGradient id="c" cx=".34" cy=".22" r=".9">
      <stop offset="0" stop-color="#454d58"/><stop offset=".48" stop-color="#21262d"/><stop offset="1" stop-color="#14171c"/>
    </radialGradient>
    <radialGradient id="b" cx=".34" cy=".22" r=".9">
      <stop offset="0" stop-color="#30363f"/><stop offset=".5" stop-color="#1a1e24"/><stop offset="1" stop-color="#101317"/>
    </radialGradient>
    <linearGradient id="ao" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".38"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a6370"/><stop offset=".5" stop-color="#2c323a"/><stop offset="1" stop-color="#1b1f25"/>
    </linearGradient>
  </defs>
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- far side: back leg and guard arm, a step darker -->
    <path d="M43 67 L33 91 L27 116" stroke="#30363d" stroke-width="11.5"/>
    <path d="M43 67 L33 91 L27 116" stroke="url(#b)" stroke-width="9.5"/>
    <path d="M43 67 L33 91 L27 116" stroke="url(#ao)" stroke-width="9.5"/>
    <path d="M20 116.5 Q27 113 34 116 L34.5 120.5 L19.5 120.5Z" fill="url(#b)" stroke="#30363d" stroke-width="1.2"/>
    <path d="M43 33 L33 45 L40 53" stroke="#30363d" stroke-width="8.5"/>
    <path d="M43 33 L33 45 L40 53" stroke="url(#b)" stroke-width="6.5"/>
    <!-- near leg, braced forward -->
    <path d="M53 66 L64 89 L67 116" stroke="#30363d" stroke-width="12.5"/>
    <path d="M53 66 L64 89 L67 116" stroke="url(#c)" stroke-width="10.5"/>
    <path d="M53 66 L64 89 L67 116" stroke="url(#ao)" stroke-width="10.5"/>
    <path d="M61 115.5 Q69 112 78 116 L78.5 121.5 L61 121.5Z" fill="url(#c)" stroke="#30363d" stroke-width="1.2"/>
    <!-- torso, leaning into the guard, with belt and skirt panels -->
    <path d="M40 69 Q36 52 41 33 Q50 27 61 31 Q65 46 61 68 Q51 73 40 69Z" fill="url(#c)" stroke="#30363d" stroke-width="1.3"/>
    <path d="M38 64 Q50 69 62 63 L64 76 Q51 82 37 77Z" fill="url(#b)" stroke="#30363d" stroke-width="1.2"/>
    <path d="M39 63 Q50 67 62 62" stroke="#3a414b" stroke-width="1.1"/>
    <!-- head with hair knot -->
    <circle cx="54" cy="20" r="8.2" fill="url(#c)" stroke="#30363d" stroke-width="1.3"/>
    <ellipse cx="47.5" cy="13.5" rx="3.6" ry="3" fill="url(#b)" stroke="#30363d" stroke-width="1"/>
    <path d="M45 21 Q52 11 61 16" stroke="#14171c" stroke-width="2.4" opacity=".7"/>
    <!-- sword arm, extended, and the blade held forward and up -->
    <path d="M57 35 L68 46 L78 41" stroke="#30363d" stroke-width="9.5"/>
    <path d="M57 35 L68 46 L78 41" stroke="url(#c)" stroke-width="7.5"/>
    <path d="M77.5 43.5 L93.5 9 L95.5 10 L81.5 45.5Z" fill="url(#blade)" stroke="#30363d" stroke-width="1"/>
    <path d="M73.5 39 L86 46" stroke="#30363d" stroke-width="3.4"/>
    <path d="M73.5 39 L86 46" stroke="#3a414b" stroke-width="1.6"/>
    <!-- soft top rim (ambient occlusion darkens each leg toward the ground above) -->
    <path d="M42 32 Q50 27 60 30.5" stroke="#596270" stroke-width="1" opacity=".55"/>
    <path d="M48 13 Q53 10.5 59 13.5" stroke="#596270" stroke-width="1" opacity=".5"/>
  </g>
</svg>
