<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 130" width="240" height="325">
  <!-- lenhon.dev inspector Actor Dummy, target: a padded wooden training post planted in the ground.
       Symmetric, so it never needs mirroring. feet_ground (0, 0) is at (48, 122) in this box. -->
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a525d"/><stop offset=".38" stop-color="#2a3038"/><stop offset="1" stop-color="#13161b"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#48505b"/><stop offset=".4" stop-color="#262b33"/><stop offset="1" stop-color="#14171c"/>
    </linearGradient>
    <linearGradient id="strap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2d333b"/><stop offset=".5" stop-color="#1b1f25"/><stop offset="1" stop-color="#101317"/>
    </linearGradient>
    <linearGradient id="ao" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".72" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/>
    </linearGradient>
  </defs>
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- packed-earth collar where the post enters the ground, in the 1/sqrt(3) ground ratio -->
    <ellipse cx="48" cy="122" rx="13" ry="7.51" fill="#101317" stroke="#30363d" stroke-width="1.2"/>
    <ellipse cx="48" cy="121.4" rx="9" ry="5.2" fill="#171b21" stroke="#2b3138" stroke-width="1"/>
    <!-- post -->
    <path d="M41 119 L41 18 Q41 11 48 11 Q55 11 55 18 L55 119 Q48 123.5 41 119Z" fill="url(#wood)" stroke="#30363d" stroke-width="1.3"/>
    <path d="M41 119 L41 18 Q41 11 48 11 Q55 11 55 18 L55 119 Q48 123.5 41 119Z" fill="url(#ao)"/>
    <g stroke="#2e353d" stroke-width=".6" opacity=".8" fill="none"><path d="M45 18 L45 112"/><path d="M50.5 20 L50.5 114"/></g>
    <!-- leather band near the top and a rounded cap -->
    <rect x="39.4" y="21" width="17.2" height="6" rx="2.4" fill="url(#strap)" stroke="#30363d" stroke-width=".9"/>
    <path d="M42 15 Q48 11.6 54 15" stroke="#6b7482" stroke-width="1" opacity=".55" fill="none"/>
    <!-- long body pad with seams and two straps -->
    <rect x="34" y="34" width="28" height="50" rx="10" fill="url(#pad)" stroke="#30363d" stroke-width="1.4"/>
    <rect x="33.4" y="41" width="29.2" height="5" rx="2" fill="url(#strap)" stroke="#30363d" stroke-width=".9"/>
    <rect x="33.4" y="73" width="29.2" height="5" rx="2" fill="url(#strap)" stroke="#30363d" stroke-width=".9"/>
    <path d="M48 47 L48 72" stroke="#3a414b" stroke-width=".9" fill="none"/>
    <path d="M37.5 37.8 Q48 34 58.5 37.8" stroke="#6b7482" stroke-width="1" opacity=".5" fill="none"/>
    <!-- chest-height target ring: the height most blows aim at -->
    <ellipse cx="48" cy="59.5" rx="7" ry="4.04" fill="none" stroke="#4a525d" stroke-width="1"/>
    <ellipse cx="48" cy="59.5" rx="2.3" ry="1.33" fill="#4a525d"/>
  </g>
</svg>
