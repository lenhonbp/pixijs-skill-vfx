<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 130" width="240" height="325">
  <!-- lenhon.dev inspector Actor Dummy, caster: unarmed clay mannequin in a neutral ready stance, facing +x.
       About seven heads tall; hands open and raised, so it suits spells, blades and strikes alike.
       feet_ground (0, 0) is at (48, 122) in this box. -->
  <defs>
    <radialGradient id="c" cx=".34" cy=".22" r=".95">
      <stop offset="0" stop-color="#474f5a"/><stop offset=".48" stop-color="#21262d"/><stop offset="1" stop-color="#13161b"/>
    </radialGradient>
    <radialGradient id="b" cx=".34" cy=".22" r=".95">
      <stop offset="0" stop-color="#323841"/><stop offset=".5" stop-color="#1a1e24"/><stop offset="1" stop-color="#101317"/>
    </radialGradient>
    <linearGradient id="ao" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".4"/>
    </linearGradient>
  </defs>
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- far limbs, a step darker: back leg, far arm -->
    <path d="M45 69 L38 94 L31 117" stroke="#30363d" stroke-width="13"/>
    <path d="M45 69 L38 94 L31 117" stroke="url(#b)" stroke-width="11"/>
    <path d="M45 69 L38 94 L31 117" stroke="url(#ao)" stroke-width="11"/>
    <circle cx="38" cy="94" r="5" fill="url(#b)" stroke="#30363d" stroke-width="1"/>
    <path d="M26 121.5 Q26.5 115.8 31.5 114.8 L39.5 117.2 Q44.5 118.8 43.5 121.5Z" fill="url(#b)" stroke="#30363d" stroke-width="1.2"/>
    <path d="M57.5 33.5 L64 47.5 L73.5 38.5" stroke="#30363d" stroke-width="8.5"/>
    <path d="M57.5 33.5 L64 47.5 L73.5 38.5" stroke="url(#b)" stroke-width="6.5"/>
    <circle cx="64" cy="47.5" r="3.6" fill="url(#b)" stroke="#30363d" stroke-width=".9"/>
    <ellipse cx="76.2" cy="36.2" rx="3.7" ry="2.7" transform="rotate(-40 76.2 36.2)" fill="url(#b)" stroke="#30363d" stroke-width="1"/>
    <!-- near leg, braced forward -->
    <path d="M52 69 L62 93 L65 117" stroke="#30363d" stroke-width="14"/>
    <path d="M52 69 L62 93 L65 117" stroke="url(#c)" stroke-width="12"/>
    <path d="M52 69 L62 93 L65 117" stroke="url(#ao)" stroke-width="12"/>
    <circle cx="62" cy="93" r="5.4" fill="url(#c)" stroke="#30363d" stroke-width="1"/>
    <path d="M60 121.5 L60.5 115.6 Q64.5 114 68.5 115.2 L78 118.4 Q81 120.4 78.4 121.5Z" fill="url(#c)" stroke="#30363d" stroke-width="1.2"/>
    <!-- pelvis and torso -->
    <path d="M43 57 Q40.5 64 42.5 72 L58.5 72 Q61 64 57.5 57Z" fill="url(#b)" stroke="#30363d" stroke-width="1.2"/>
    <path d="M39 31 C37 40 39.5 50 43.5 58 L55.5 58 C60 50 62 40 60 31 Q49.5 25.5 39 31Z" fill="url(#c)" stroke="#30363d" stroke-width="1.3"/>
    <path d="M43 58.5 Q49.5 61 56 58.5" stroke="#3a414b" stroke-width="1"/>
    <path d="M43.5 38.5 Q50 42.5 56.5 38.5" stroke="#3a414b" stroke-width=".8" opacity=".8"/>
    <!-- neck and head, chin forward -->
    <path d="M50.5 22.5 L50 30" stroke="#30363d" stroke-width="6.6"/>
    <path d="M50.5 22.5 L50 30" stroke="url(#b)" stroke-width="4.6"/>
    <path d="M45.4 14 Q45 6.8 52 6.6 Q59.6 6.8 59 15 Q58.8 19 57.2 22 Q54 24.4 50.2 22.4 Q46 19.4 45.4 14Z" fill="url(#c)" stroke="#30363d" stroke-width="1.3"/>
    <path d="M56.2 10.5 Q59 14 57 20.5" stroke="#4d5662" stroke-width=".9" opacity=".7"/>
    <!-- near arm, open hand lowered a little so the two hands read apart -->
    <circle cx="43.5" cy="34.5" r="5.2" fill="url(#c)" stroke="#30363d" stroke-width="1"/>
    <path d="M43.5 34.5 L47.5 51 L60.5 45.5" stroke="#30363d" stroke-width="9.5"/>
    <path d="M43.5 34.5 L47.5 51 L60.5 45.5" stroke="url(#c)" stroke-width="7.5"/>
    <circle cx="47.5" cy="51" r="4" fill="url(#c)" stroke="#30363d" stroke-width=".9"/>
    <ellipse cx="63.6" cy="44" rx="4" ry="3" transform="rotate(-30 63.6 44)" fill="url(#c)" stroke="#30363d" stroke-width="1.1"/>
    <path d="M62.4 41.6 L66.2 40.4" stroke="#596270" stroke-width=".9" opacity=".7"/>
    <!-- soft rim light on the top planes -->
    <path d="M40 31.5 Q49.5 27 59 31.4" stroke="#6b7482" stroke-width="1" opacity=".5"/>
    <path d="M47 8.8 Q52 6.8 57 9.2" stroke="#6b7482" stroke-width="1" opacity=".55"/>
    <path d="M52 71 L61 91" stroke="#596270" stroke-width=".9" opacity=".35"/>
  </g>
</svg>
