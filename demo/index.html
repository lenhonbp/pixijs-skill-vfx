<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0a10" />
  <meta name="description" content="Code-drawn 2.5D skill VFX for PixiJS v7/v8: Wu Xing elements plus wind, ribbons, distortion and bloom. Zero art assets." />
  <title>PixiJS Skill VFX Kit · 2.5D · Wu Xing + Wind</title>
  <style>
    :root {
      --bg: #09080d; --panel: #121019; --panel-2: #181522; --line: #26222f; --line-2: #34304a;
      --text: #ecebf3; --dim: #8b87a0; --faint: #5c5872; --accent: #f3d36b; --radius: 14px;
      --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; min-height: 100vh; color: var(--text);
      background: radial-gradient(1100px 520px at 65% -12%, #1c1830 0%, transparent 70%), var(--bg);
      font: 14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    button { font: inherit; color: inherit; touch-action: manipulation; }
    kbd { font: 600 10.5px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--dim); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 5px; padding: 1px 5px; }

    header { display: flex; align-items: center; gap: 12px; padding: 14px max(22px, var(--safe-r)) 14px max(22px, var(--safe-l)); max-width: 1500px; margin: 0 auto; }
    .logo { width: 30px; height: 30px; flex: none; border-radius: 9px; background: conic-gradient(from 200deg, #f3d36b, #7ee05a, #4fc3ff, #8ff0d0, #ff7a2a, #d9a050, #f3d36b); box-shadow: 0 0 22px -4px rgba(255, 190, 90, .45); }
    header h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: .1px; }
    header p { margin: 1px 0 0; color: var(--dim); font-size: 12.5px; }
    header .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .badge { border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 12px; color: var(--dim); white-space: nowrap; }
    .gh { display: inline-flex; align-items: center; gap: 6px; color: var(--text); text-decoration: none; border: 1px solid var(--line-2); border-radius: 999px; padding: 4px 12px; font-size: 12.5px; background: var(--panel); }
    .gh:hover { border-color: #4b4566; }
    .gh svg { width: 15px; height: 15px; fill: currentColor; }

    main { display: grid; grid-template-columns: 310px minmax(0, 1fr); gap: 18px; padding: 4px max(22px, var(--safe-r)) 18px max(22px, var(--safe-l)); max-width: 1500px; margin: 0 auto; align-items: start; }
    aside { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 10px; position: sticky; top: 14px; max-height: calc(100vh - 28px); }
    #tabs { display: flex; flex-wrap: wrap; gap: 6px; }
    #tabs button { background: transparent; color: var(--dim); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; cursor: pointer; font-size: 12.5px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
    #tabs button::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--c); opacity: .9; }
    #tabs button[data-key="all"]::before { display: none; }
    #tabs button:hover { color: var(--text); border-color: var(--line-2); }
    #tabs button.active { color: #101014; background: var(--c); border-color: var(--c); font-weight: 600; }
    #tabs button.active::before { background: #101014; opacity: .5; }
    #skills { overflow: auto; display: flex; flex-direction: column; gap: 5px; padding-right: 2px; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
    .skill { position: relative; display: grid; grid-template-columns: 24px 1fr auto; align-items: center; gap: 10px; text-align: left; background: var(--panel-2); border: 1px solid transparent; border-radius: 10px; padding: 8px 10px 8px 12px; cursor: pointer; transition: background .15s, border-color .15s; }
    .skill::before { content: ''; position: absolute; left: 0; top: 9px; bottom: 9px; width: 3px; border-radius: 0 3px 3px 0; background: var(--c); }
    .skill:hover { background: #1f1c2b; }
    .skill.active { border-color: color-mix(in srgb, var(--c) 70%, transparent); background: color-mix(in srgb, var(--c) 9%, #17141f); box-shadow: 0 0 24px -10px var(--c); }
    .skill kbd { text-align: center; padding: 2px 0; }
    .skill .names { display: flex; flex-direction: column; min-width: 0; }
    .skill b { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .skill i { font-style: normal; color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cat { font-size: 10px; text-transform: uppercase; letter-spacing: .7px; color: var(--dim); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }

    section { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    #stage { position: relative; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); background: #14121b; box-shadow: 0 24px 60px -28px rgba(0, 0, 0, .9); width: 100%; aspect-ratio: 1120 / 630; touch-action: manipulation; }
    #stage canvas { display: block; width: 100% !important; height: 100% !important; }
    #stats { position: absolute; top: 10px; right: 10px; font: 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; color: #d6d2e6; background: rgba(10, 9, 16, .55); padding: 4px 9px; border-radius: 7px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); pointer-events: none; }
    #now { position: absolute; left: 12px; bottom: 10px; display: none; align-items: center; gap: 8px; pointer-events: none; font-size: 12.5px; background: rgba(10, 9, 16, .55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border-radius: 8px; padding: 4px 10px; }
    #now b { color: var(--c); }
    #tap { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; pointer-events: none; }

    .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .group { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
    .group .lbl { color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: .7px; padding: 0 6px 0 7px; align-self: center; }
    .bar button { background: transparent; border: 0; border-radius: 7px; padding: 6px 11px; cursor: pointer; font-size: 13px; color: #cfcbe0; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; transition: background .12s, color .12s; }
    .bar button:hover { background: #1f1c2b; color: var(--text); }
    .bar button.active { background: var(--accent); color: #16130a; font-weight: 600; }
    .bar button.active kbd { color: #5a4a10; border-color: #b39a3c; }
    .bar button.primary { background: #ecebf3; color: #111; font-weight: 600; }
    .bar button.primary:hover { background: #fff; }
    .bar button.toggle.on { background: #24203a; color: var(--text); box-shadow: inset 0 0 0 1px #4b4566; }
    .bar button.toggle::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
    .bar button.toggle.on::before { background: #8ff0d0; box-shadow: 0 0 8px #8ff0d0; }
    .bar .hint { margin-left: auto; color: var(--faint); font-size: 12px; }
    svg.i { width: 14px; height: 14px; fill: currentColor; }

    #info { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 18px; }
    #info h2 { margin: 6px 0 4px; font-size: 20px; font-weight: 650; }
    #info h2 small { color: var(--dim); font-weight: 400; font-size: 14px; margin-left: 10px; }
    #info p { margin: 0 0 10px; color: #c9c5d8; }
    .info-head { display: flex; gap: 8px; align-items: center; }
    .el { color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 60%, transparent); background: color-mix(in srgb, var(--c) 10%, transparent); border-radius: 999px; padding: 1px 10px; font-size: 12px; font-weight: 600; }
    .uses { display: flex; gap: 6px; flex-wrap: wrap; }
    .uses code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; background: #0d0c13; border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; color: #bdb6ff; }
    footer { text-align: center; color: var(--faint); font-size: 12px; padding: 4px 16px calc(18px + var(--safe-b)); }
    footer a { color: var(--dim); }

    @media (hover: none) { .hint, .skill kbd, .bar kbd { display: none !important; } .skill { grid-template-columns: 1fr auto; } }

    /* ------------------------------------------------ phone / small tablet */
    @media (max-width: 900px) {
      header { padding: 10px max(14px, var(--safe-r)) 8px max(14px, var(--safe-l)); }
      header p, .badge.opt { display: none; }
      main { display: flex; flex-direction: column; align-items: stretch; gap: 10px; padding: 0 0 12px; }
      aside, #info, .bar { min-width: 0; }
      section { display: contents; }
      #stage { position: sticky; top: 0; z-index: 5; order: 1; border-radius: 0; border-left: 0; border-right: 0; }
      #now { display: flex; }
      .bar { order: 2; padding: 0 max(12px, var(--safe-r)) 0 max(12px, var(--safe-l)); gap: 6px; overflow-x: auto; flex-wrap: nowrap; scrollbar-width: none; }
      .bar::-webkit-scrollbar { display: none; }
      .bar button { padding: 8px 11px; min-height: 36px; }
      .group { flex: none; }
      aside { order: 3; position: static; max-height: none; background: transparent; border: 0; padding: 0 max(12px, var(--safe-r)) 0 max(12px, var(--safe-l)); }
      #tabs { flex-wrap: nowrap; overflow-x: auto; margin: 0 -12px; padding: 2px 12px; scrollbar-width: none; }
      #tabs::-webkit-scrollbar { display: none; }
      #tabs button { padding: 7px 13px; font-size: 13px; }
      #skills { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 7px; overflow: visible; }
      .skill { grid-template-columns: 1fr; gap: 4px; padding: 10px 10px 10px 13px; min-height: 58px; }
      .skill .cat { justify-self: start; }
      #info { order: 4; margin: 0 max(12px, var(--safe-r)) 0 max(12px, var(--safe-l)); padding: 12px 14px; }
      #info h2 { font-size: 17px; }
      #stats { top: 6px; right: 6px; font-size: 10.5px; padding: 3px 7px; }
    }
    @media (max-width: 900px) and (orientation: landscape) and (max-height: 500px) {
      #stage { position: relative; max-height: 78vh; width: auto; margin: 0 auto; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo"></div>
    <div>
      <h1>PixiJS Skill VFX Kit</h1>
      <p>Code-drawn 2.5D skill effects · Ngũ Hành + Phong · zero art assets</p>
    </div>
    <div class="right">
      <span class="badge opt" id="version"></span>
      <span class="badge opt" id="count"></span>
      <a class="gh" href="https://github.com/lenhonbp/pixijs-skill-vfx" target="_blank" rel="noopener"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>GitHub</a>
    </div>
  </header>
  <main>
    <aside>
      <div id="tabs"></div>
      <div id="skills"></div>
    </aside>
    <section>
      <div id="stage"><div id="stats"></div><div id="now"></div></div>
      <div class="bar">
        <div class="group">
          <label class="lbl" for="tier">Tier</label>
          <select id="tier" style="background:#17141f;color:#ecebf3;border:0;border-radius:7px;max-width:125px" aria-label="Activation tier">
            <option value="1">Cơ bản</option><option value="2">Thức tỉnh</option><option value="3">Tiến hoá</option>
          </select>
          <button id="evolve">Evolve</button>
        </div>
        <div class="group">
          <button id="replay" class="primary"><svg class="i" viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z"/></svg>Cast <kbd>Space</kbd></button>
          <button id="pause">Pause</button>
          <button id="reset">Reset <kbd>Esc</kbd></button>
          <button id="showcase">Showcase</button>
        </div>
        <div class="group">
          <span class="lbl">Speed</span>
          <button data-speed="1" class="active">1x</button>
          <button data-speed="0.5">½</button>
          <button data-speed="0.25">¼</button>
        </div>
        <div class="group">
          <span class="lbl">Quality</span>
          <button data-quality="high">High</button>
          <button data-quality="medium">Med</button>
          <button data-quality="low">Low</button>
        </div>
        <div class="group">
          <button id="bloom" class="toggle">Bloom</button>
          <button id="distortion" class="toggle">Distortion</button>
        </div>
        <span class="hint">1-0, Q-O, Z-V cast · S speed · P pause · A showcase</span>
      </div>
      <div id="info"></div>
    </section>
  </main>
  <footer>Built with PixiJS · every texture is generated in code at startup · <a href="https://github.com/lenhonbp/pixijs-skill-vfx" target="_blank" rel="noopener">MIT on GitHub</a></footer>
  <script src="demo.js"></script>
</body>
</html>
