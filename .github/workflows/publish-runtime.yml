name: Publish runtime to npm

on:
  push:
    tags: ['runtime-v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install --no-save --package-lock=false pixi.js@8.23.0 typescript
      - name: Check the tag matches the package version
        if: github.ref_type == 'tag'
        run: test "runtime-v$(node -p "require('./runtime/package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm --prefix runtime run typecheck
      - run: npm install -g npm@^11.5.1 # trusted publishing (OIDC) needs npm 11.5.1+
      - run: npm publish
        working-directory: runtime
