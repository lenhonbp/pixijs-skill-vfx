name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false pixi.js@8.23.0 typescript esbuild
      - run: npm run check:docs
      - run: npm run check:catalog
      - run: npm run typecheck
      - name: Restore hosted Free packs for the smoke tests
        uses: actions/cache@v4
        with:
          path: showcase/public/packs/free
          key: free-packs-${{ hashFiles('showcase/public/packs/free/index.json') }}
      - run: node skills/lenhon-vfx/scripts/fetch-packs.mjs --all --out showcase/public/packs/free
      - name: Build the showcase against the local restored packs
        run: npm run build
        env:
          VITE_PACKS_URL: packs/free
      - run: npx playwright install --with-deps chromium
      - name: Runtime and storefront browser checks
        run: |
          mkdir -p test-artifacts
          npm run check:runtime
        env:
          VFX_SCREENSHOT: test-artifacts/free-desktop.png
          VFX_MOBILE_SCREENSHOT: test-artifacts/free-mobile.png
          VFX_CATALOG_SCREENSHOT: test-artifacts/library-desktop.png
          VFX_CATALOG_MOBILE_SCREENSHOT: test-artifacts/library-mobile.png
      - name: Storefront screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-screenshots
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 14
